---
# Create dirs 
- name: Create data dir
  ansible.builtin.file:
    path: "{{ host_data_dir }}"
    state: directory

- name: Create config dir
  ansible.builtin.file:
    path: "{{ host_config_dir }}"
    state: directory

# Template files
- name: Template evmos archive node config file
  ansible.builtin.template:
    src: templates/config.toml
    dest: "{{ host_config_dir }}/config.toml"
  notify:
    - Restart_evmos_docker

- name: Template evmos archive node app file
  ansible.builtin.template:
    src: templates/app.toml
    dest: "{{ host_config_dir }}/app.toml"
  notify:
    - Restart_evmos_docker

- name: Template evmos archive node init file
  ansible.builtin.template:
    src: templates/init.sh.j2
    dest: "{{ host_config_dir }}/init.sh"
  notify:
    - Restart_evmos_docker
