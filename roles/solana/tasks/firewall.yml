---
- name: install ufw
  apt:
    name: ufw
    state: present
  become: yes

- name: Allow SSH in UFW
  ufw:
    rule: allow
    port: 22
    proto: tcp
  become: yes

- name: Allow solana in UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  become: yes
  loop: "{{ solana_port_range }}"

- name: Set UFW default policy
  ufw:
    state: enabled
    policy: allow
  become: yes
