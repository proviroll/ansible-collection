---
## Script and Exec Paths/vars
- name: create solana service
  shell:
    cmd: |
      bash -c "cat >/etc/systemd/system/sol.service <<EOF
      [Unit]
      Description=Solana Validator
      After=network.target
      Wants=solana-sys-tuner.service
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      Restart=always
      RestartSec=1
      User=devops
      LimitNOFILE=700000
      LogRateLimitIntervalSec=0
      Environment="PATH={{ solana_binary_path }}"
      ExecStart=/home/devops/solana-validator/config/validator.sh
      [Install]
      WantedBy=multi-user.target
      EOF"
  become: yes

- name: create system tuner service
  shell:
    cmd: |
      bash -c "cat >/etc/systemd/system/solana-sys-tuner.service <<EOF
      [Unit]
      Description=Solana System Tuner
      After=network.target

      [Service]
      Type=simple
      Restart=on-failure
      RestartSec=1
      LogRateLimitIntervalSec=0
      ExecStart=/home/devops/.local/share/solana/install/active_release/bin/solana-sys-tuner --user devops

      [Install]
      WantedBy=multi-user.target
      EOF"
  become: yes

- name: Restart systemctl daemon
  shell:
    cmd: systemctl daemon-reload
  become: yes
