---
# Remove 'initial user' and Old ssh keys
- name: Test SSH connection with "{{ bootstrap_user }}" and "{{ backup_user }}"
  ansible.builtin.command:
    cmd: "whoami"
  register: ssh_test
  become: false
  remote_user: "{{ item }}"
  ignore_errors: true
  loop:
    - "{{ bootstrap_user }}"
    - "{{ backup_user }}"

# - name: Remove initial user only if new user can connect
#   ansible.builtin.user:
#     name: "{{ initial_remote_user }}"
#     state: absent
#     remove: true
#   when: ssh_test.rc == 0

- name: Remove Github authorized keys from user {{bootstrap_user}}
  loop: "{{old_github_user_pubkeys}}"
  ansible.posix.authorized_key:
    user: "{{ bootstrap_user }}"
    state: absent
    key: https://github.com/{{ item }}.keys

- name: Remove Github authorized keys from user {{backup_user}}
  loop: "{{old_github_user_pubkeys}}"
  ansible.posix.authorized_key:
    user: "{{ backup_user }}"
    state: absent
    key: https://github.com/{{ item }}.keys
