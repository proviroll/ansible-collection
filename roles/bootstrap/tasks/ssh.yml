---
- name: Ensure 'ssh' directory is present for users
  ansible.builtin.file:
    path: /home/{{ item }}/.ssh
    state: directory
    owner: "{{ item }}"
  loop:
    - "{{ bootstrap_user }}"
    - "{{ backup_user }}"

- name: Add SSH public keys to {{ bootstrap_user }} user
  loop: "{{ github_user_pubkeys }}"
  ansible.posix.authorized_key:
    user: "{{ bootstrap_user }}"
    state: present
    key: "https://github.com/{{ item }}.keys"

- name: Add SSH public keys to {{ backup_user }} user
  loop: "{{ github_user_pubkeys }}"
  ansible.posix.authorized_key:
    user: "{{ backup_user }}"
    state: present
    key: https://github.com/{{ item }}.keys

# Double checking 'ssh' is allowed
- name: Check if ufw is installed
  shell: ufw status
  register: ufw_status
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: If ufw is installed, allow ssh
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    comment: "ssh"
  when: ufw_status.rc == 0

- name: Installing hardened SSH configuration 
  template:
    src: sshd_config
    dest: /etc/ssh/sshd_config

# Handle 'sshd' and 'ssh.socket' if it's used
# Ref : https://discourse.ubuntu.com/t/sshd-now-uses-socket-based-activation-ubuntu-22-10-and-later/30189/9
- name: Check if ssh.socket is enabled
  command: systemctl is-enabled ssh.socket
  register: ssh_socket_status
  ignore_errors: true

- name: Install new 'ssh.Socket' configuration
  template:
    src: ssh.socket
    dest: /lib/systemd/system/ssh.socket
  when: ssh_socket_status.stdout == "enabled"

- name: Reload systemd manager configuration
  command: systemctl daemon-reload
  when: ssh_socket_status.stdout == "enabled"

- name: Restart SSH socket
  systemd:
    name: ssh.socket
    state: restarted
  when: ssh_socket_status.stdout == "enabled"

- name: Restart SSH service
  systemd:
    name: ssh
    state: restarted
  when: ssh_socket_status.stdout == "enabled"

# Handle only 'sshd' , in case 'ssh.socket' is not used
- name: Restart SSH daemon (Other versions)
  systemd:
    name: sshd
    state: restarted
  when: ssh_socket_status.stdout != "enabled"
