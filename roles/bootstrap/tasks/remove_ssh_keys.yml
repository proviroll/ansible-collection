---
- name: Remove Github authorized keys from user {{bootstrap_user}}
  loop: "{{old_github_user_pubkeys}}"
  ansible.posix.authorized_key:
    user: "{{ bootstrap_user }}"
    state: absent
    key: https://github.com/{{ item }}.keys

- name: Remove Github authorized keys from user {{backup_user}}
  loop: "{{old_github_user_pubkeys}}"
  ansible.posix.authorized_key:
    user: "{{ backup_user }}"
    state: absent
    key: https://github.com/{{ item }}.keys
