- name: Run Celestia App container
  docker_container:
    name: celestia-app
    image: ghcr.io/celestiaorg/celestia-app:9523b4c  # Use specified Docker image
    state: started
    ports:
      - "{{ env_vars.RPC_PORT }}:{{ env_vars.RPC_PORT }}"    # RPC Port
      - "{{ env_vars.P2P_PORT }}:{{ env_vars.P2P_PORT }}"    # P2P Port
      - "{{ env_vars.GRPC_PORT }}:{{ env_vars.GRPC_PORT }}"  # gRPC Port
    volumes:
      - "{{ ansible_env.HOME }}/celestia-app:/app/celestia"  # Mount directory inside container at /app/celestia
    env_file: "{{ ansible_env.HOME }}/celestia-app/celestia.env"
    environment:
      SEEDS: "ee9f90974f85c59d3861fc7f7edb10894f6ac3c8@seed-mocha.pops.one:26656"  # Adding seed directly
      MAX_NUM_PEERS: "2"          # Limit the number of peers
    restart_policy: always