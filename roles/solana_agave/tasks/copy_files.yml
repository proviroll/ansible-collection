- name: template validator start up script
  template:
    src: templates/{{ network_type }}-validator.sh.j2
    dest: "{{ solana_validator_dir }}/config/validator.sh"
    owner: "{{ non_root_user }}"
    group: "{{ non_root_group }}"
    mode: "0755"
  become: no

- name: Copy 'solana-exporter' docker compose file
  template:
    src: templates/exporter.docker-compose.yml.j2
    dest: "{{ solana_exporter_dir }}/exporter.docker-compose.yml"
