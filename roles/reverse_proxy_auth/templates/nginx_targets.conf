events {
    use           epoll;
    worker_connections  128;
}

    server {
        listen {{metrics_node_exporter_public_port}};

        location / {
            auth_basic             "Restricted";
            auth_basic_user_file   /etc/nginx/.htpasswd;

            proxy_pass             http://127.0.0.1:{{metrics_node_exporter_local_port}};
        }
    }
