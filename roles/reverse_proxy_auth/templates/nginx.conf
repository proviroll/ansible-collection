events {
    use           epoll;
    worker_connections  1024;
}



http {

    map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
    }

    server {
        listen 39090;
        server_name prometheus-infra.chainsafe.dev www.prometheus-infra.chainsafe.dev;
        
        location / {
                proxy_pass  http://localhost:9090;
        }

    }

    server {
        listen 39093;
        server_name alertmanager-infra.chainsafe.dev www.alertmanager-infra.chainsafe.dev;

        location / {
                auth_basic             "Restricted";
                auth_basic_user_file   /etc/nginx/.htpasswd;
                proxy_pass  http://localhost:9093;
        }

    }


    server {
        listen 33100;
        server_name loki-infra.chainsafe.dev www.loki-infra.chainsafe.dev;

        location / {
            proxy_set_header Host loki-infra.chainsafe.io;
            proxy_pass  http://localhost:3100;
        }
    }

    server {
            listen {{metrics_node_exporter_public_port}};

        location / {
            auth_basic             "Restricted";
            auth_basic_user_file   /etc/nginx/.htpasswd;

            proxy_pass             http://127.0.0.1:{{metrics_node_exporter_local_port}};
        }
    }
    
    

}
