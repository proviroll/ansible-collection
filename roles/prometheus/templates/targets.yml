---
{% if item in groups.get('lotus', '') %}
- labels:
    job: lotus
    instance: "{{ item }}"
    network: "{{ hostvars[item]['network'] }}"
    client_name: "lotus"
  targets:
    - "{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['lotus_metrics_public_port'] }}"
{% endif %}

{% if item in groups.get('forest', '') %}
- labels:
    job: forest
    instance: "{{ item }}"
    network: "{{ hostvars[item]['network'] }}"
    client_name: "forest"
  targets:
    - "{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['forest_metrics_public_port'] }}"
{% endif %}

- labels:
    job: node_exporter
    instance: "{{ item }}"
{%  if item in groups['metrics']  %}
  targets:
    - "{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['node_exporter_port'] }}"
{% else %}
  targets:
    - "{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['node_exporter_public_port'] }}"
{% endif %}

{% if item in groups.get('polkadot', '') %}
- labels:
    job: polkadot
    instance: "{{ item }}"
    network: "{{ hostvars[item]['network'] }}"
    client_name: "polkadot"
  targets:
    - "{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['polkadot_metrics_public_port'] }}"
{% endif %}
