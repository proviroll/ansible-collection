---
- name: Install dependencies
  ansible.builtin.apt:
    name: [prometheus]
    state: latest
    update_cache: true

- name: Stop binary Prometheus service
  ansible.builtin.service:
    name: prometheus
    state: stopped
    enabled: no

- name: Create docker volume prometheus_data
  community.docker.docker_volume:
    name: prometheus_data

- name: Create prometheus_config_dir
  ansible.builtin.file:
    path: '{{ prometheus_config_dir }}'
    state: directory

- name: Create prometheus targets dir
  ansible.builtin.file:
    path: '{{ prometheus_config_dir }}/targets'
    state: directory

- name: Find target files
  ansible.builtin.find:
    paths: '{{ prometheus_config_dir }}/targets'
    recurse: true
  register: target_files

- name: Remove foreign target files
  with_items: "{{ target_files.files | map(attribute='path') | map('basename') | list }}"
  when: (item.split('.') | first) not in hostvars
  ansible.builtin.file:
    path: '{{ prometheus_config_dir }}/targets/{{ item }}'
    state: absent

- name: Template prometheus config file
  ansible.builtin.template:
    src: ./templates/prometheus.yml.j2
    dest: '{{ prometheus_config_dir }}/prometheus.yml'
  notify:
    - Reload prometheus

- name: Template prometheus web config file
  when: prometheus_auth_enabled | bool
  ansible.builtin.template:
    src: ./templates/web-config.yml.j2
    dest: '{{ prometheus_config_dir }}/web-config.yml'
  notify:
    - Reload prometheus

- name: Copy prometheus rules file
  # Don't template to prevent clashing with alertmanager templating
  ansible.builtin.copy:
    src: ./templates/rules.yml
    dest: '{{ prometheus_config_dir }}/rules.yml'
    validate: promtool check rules %s
  notify:
    - Reload prometheus

- name: Remove Prometheus container if running
  community.docker.docker_container:
    name: '{{ prometheus_container_name }}'
    state: absent

- name: Start prometheus
  community.docker.docker_container:
    name: '{{ prometheus_container_name }}'
    state: started
    image: prom/prometheus
    pull: true
    stop_timeout: 20

    command: >
      --config.file={{ prometheus_config_container_dir }}/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address="0.0.0.0:{{ prometheus_web_port }}"
      --web.enable-lifecycle {% if prometheus_auth_enabled | bool %} --storage.tsdb.retention.time=30d --web.config.file={{ prometheus_config_container_dir }}/web-config.yml
      {% endif %}

    volumes:
      - '{{ prometheus_config_dir }}:{{ prometheus_config_container_dir }}'
      - prometheus_data:/prometheus

    restart_policy: unless-stopped
    network_mode: host
    log_driver: json-file
    log_options:
      max-file: '10'
      max-size: 30m
      mode: non-blocking
      max-buffer-size: 4m
