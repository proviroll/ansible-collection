---
- name: Create solana-faucet systemd service
  template:
    src: solana-faucet.service.j2
    dest: /etc/systemd/system/solana-faucet.service
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: restart solana-faucet

- name: Enable and start solana-faucet service
  systemd:
    name: solana-faucet
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
