- name: Deploy solana validator
  hosts: all
  become: true
  vars_files:
    - "../../vault.yml"
  vars:
    network: solana
    network_type: testnet # Values : testnet, devnet, mainnet-beta
    chain_id: 
    metrics_apps:
      nodeexporter:
        port: "{{ nodeexporter_port }}"
        public_port: "{{ nodeexporter_public_port }}"
        host: "127.0.0.1"
      validator:
        port: 7999
        public_port: 37999
        host: "127.0.0.1"
      solana_exporter:
        port: 9999
        public_port: 39999
        host: "127.0.0.1"
  roles:
    - solana_firedancer
    - monitoring_target_nginx
