---
- name: Upgrade Agave Validator
  hosts: all
  become: true
  vars:
    network: solana
    network_type: testnet # Values : testnet, devnet, mainnet-beta
    solana_previous_version: "v3.1.8"
    solana_version: "v3.1.10"
    deployment_type: upgrade
  
  tasks:
    - name: Perform pre-upgrade safe window audit
      include_role:
        name: solana_agave
        tasks_from: check_window.yml

    - name: Stop solana service
      systemd:
        name: solana
        state: stopped

    - name: Run solana installation tasks
      include_role:
        name: solana_agave
        tasks_from: solana_install.yml

    - name: Start solana service
      systemd:
        name: solana
        state: started
        enabled: yes
