---
- name: Upgrade solana firedancer validator
  hosts: all
  become: true
  vars:
    network: solana
    solana_previous_version : "v0.711.30006"
    solana_version: "v0.802.30008" # Must be updated on 'solana_firedancer' role as well
    deployment_type: upgrade
    network_type: testnet # Values : testnet, devnet, mainnet-beta
  roles:
    - solana_firedancer
